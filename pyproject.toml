[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-memory"
version = "0.1.0"
description = "Certified and empirical experiments for ASCENT test-time memory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
gpu = ["torch>=2.8", "transformers>=4.55,<5", "safetensors>=0.5"]

[tool.setuptools.packages.find]
include = ["ascent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
